<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View People</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <!-- Navigation bar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Vision Voyager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Home</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1 class="mt-3">View People</h1>
        <a href="{{ url_for('add_person') }}" class="btn btn-primary mb-3">Add Person</a>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Office Room Number</th>
                    <th>Department or Major</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for person in people %}
                    <tr>
                        <td>{{ person.name }}</td>
                        <td>{{ person.status }}</td>
                        <td>{{ person.office_room_number }}</td>
                        <td>{{ person.department_or_major }}</td>
                        <td>
                            <a href="{{ url_for('edit_person', person_id=person.doc_id) }}" class="btn btn-warning btn-sm">Edit</a>
                            <form action="{{ url_for('delete_person', person_id=person.doc_id) }}" method="post" style="display: inline;">
                                {{ form.csrf_token }}
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                            <form action="{{ url_for('find_person') }}" method="post" enctype="multipart/form-data" style="display: inline;">
                                {{ form.csrf_token }}
                                <input type="hidden" name="person_id" value="{{ person.doc_id }}">
                                <input type="file" name="image" required>
                                <button type="submit" class="btn btn-primary btn-sm">Find</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
