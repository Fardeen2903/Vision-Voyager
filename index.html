<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>People Database</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h1 class="mt-3">Vision Voyagers Dashboard</h1>
        <a href="{{ url_for('add_person') }}" class="btn btn-primary mb-3">Add Person</a>
        <table class="table table-bordered">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Status</th>
                    <th>Office Room Number</th>
                    <th>Department or Major</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for person in people %}
                    <tr>
                        <td>{{ person.name }}</td>
                        <td>{{ person.status }}</td>
                        <td>{{ person.office_room_number }}</td>
                        <td>{{ person.department_or_major }}</td>
                        <td>
                            <a href="{{ url_for('edit_person', person_id=person.doc_id) }}" class="btn btn-warning btn-sm">Edit</a>
                            <form action="{{ url_for('delete_person', person_id=person.doc_id) }}" method="post" style="display: inline;">
                                <button type="submit" class="btn btn-danger btn-sm">Delete</button>
                            </form>
                        </td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
