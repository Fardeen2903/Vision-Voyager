<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test App</title>
    <!-- Bootstrap CSS for styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('../static/site_background.jpg');
            background-size: cover; /* Cover the entire background */
            background-position: center; /* Center the background image */
            background-repeat: no-repeat; /* Prevent background from repeating */
            background-attachment: fixed; /* Keep the background fixed while scrolling */
            color: #333;
            margin: 0; /* Remove default body margin */
            padding: 0; /* Remove default body padding */
        }
        .container {
            margin-top: 100px;
            text-align: center;
        }
        h1 {
            font-size: 3rem;
            font-weight: bold;
            color: #007bff;
        }
        p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }
        .navbar-brand img {
            width: 50px; /* Set the width of the logo image */
            margin-right: 10px; /* Add margin to separate the logo from the text */
        }
        .btn {
            font-size: 1.2rem;
            padding: 15px 30px;
            margin: 10px;
            border-radius: 25px;
            text-transform: uppercase;
            transition: all 0.3s ease-in-out; /* Added animation */
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
            transform: scale(1.05); /* Added hover effect */
        }
        .btn-secondary {
            background-color: #6c757d;
            border-color: #6c757d;
        }
        .btn-secondary:hover {
            background-color: #5a6268;
            border-color: #545b62;
            transform: scale(1.05); /* Added hover effect */
        }
        /* Sidebar styles */
        .sidebar {
            height: 100%;
            width: 0;
            position: fixed;
            z-index: 1;
            top: 0;
            right: 0;
            background-color: #111;
            overflow-x: hidden;
            transition: 0.5s;
            padding-top: 60px;
        }
        .sidebar a {
            padding: 10px 25px;
            text-decoration: none;
            font-size: 20px;
            color: #818181;
            display: block;
            transition: 0.3s;
        }
        .sidebar a:hover {
            color: #f1f1f1;
        }
        .sidebar .close-btn {
            position: absolute;
            top: 0;
            right: 25px;
            font-size: 36px;
            margin-left: 50px;
        }
        @media screen and (max-height: 450px) {
            .sidebar {padding-top: 15px;}
            .sidebar a {font-size: 18px;}
        }
    </style>
</head>
<body>
    <!-- Hamburger Icon -->
    <div class="sidebar">
        <a href="javascript:void(0)" class="close-btn" onclick="closeNav()">&times;</a>
        <a href="/ai-solutions">AI Solutions</a>
        <a href="/robotics">Robotics</a>
        <a href="/custom-solutions">Custom Solutions</a>
    </div>

    <div class="container mt-3">
        <h1>Face Recognition Test</h1>
        <p>Click the button below to start the face recognition process.</p>
        <button id="start-recognition" class="btn btn-primary">Start Face Recognition</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.getElementById('start-recognition').addEventListener('click', function() {
            if (confirm("Do you want to be added to the database?")) {
                // Redirect to the add person screen if user confirms
                window.location.href = "/add_person";
            } else {
                // Start face recognition process if user cancels
                fetch('/start_face_recognition')
                    .then(response => response.json())
                    .then(data => {
                        alert(data.message);
                    })
                    .catch(error => {
                        console.error('Error during operation:', error);
                        alert('Error. See console for details.');
                    });
            }
        });
    
        function openNav() {
            document.querySelector('.sidebar').style.width = '250px';
        }
    
        function closeNav() {
            document.querySelector('.sidebar').style.width = '0';
        }
    </script>
    
</body>
</html>
