<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Person</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-3">
        <h1>Add Person</h1>
        <form id="addPersonForm" action="/add_person" method="post">
            <!-- Flask's CSRF token for form security -->
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <!-- Other form fields for name, status, etc. -->

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" name="name" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Status</label>
                <input type="text" class="form-control" name="status" required>
            </div>
            <!-- Hidden input for base64 image data -->
            <input type="hidden" id="base64Image" name="base64_image" value="">

            <div class="mb-3">
                <label class="form-label">Capture Photo</label>
                <video id="video" width="640" height="480" autoplay></video>
                <button type="button" id="snap" class="btn btn-primary">Capture</button>
                <canvas id="canvas" width="640" height="480" style="display: none;"></canvas>
                <img id="photo" style="display: none; width: 640px; height: 480px;">
            </div>
            <button type="submit" class="btn btn-success">Add Person</button>
        </form>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const context = canvas.getContext('2d');
        const snap = document.getElementById('snap');
        const photo = document.getElementById('photo');
        const base64Image = document.getElementById('base64Image');

        // Access webcam
        async function init() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
            } catch (e) {
                console.error(`navigator.getUserMedia error: ${e.toString()}`);
            }
        }

        snap.addEventListener("click", function() {
            context.drawImage(video, 0, 0, 640, 480);
            // Hide video and show canvas
            video.style.display = 'none';
            canvas.style.display = 'block';

            // Convert canvas content to base64 and set it as the value of the hidden input
            let imageDataUrl = canvas.toDataURL("image/jpeg");
            base64Image.value = imageDataUrl;

            // Update the image element and display it
            photo.src = imageDataUrl;
            photo.style.display = 'block';
            canvas.style.display = 'none';  // Optionally hide the canvas if you want to display the image instead
        });

        init();
    </script>
</body>
</html>
